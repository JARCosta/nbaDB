<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Game Stats - nbaDB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="shortcut icon" href="https://www.nba.com/favicon-32x32.png" type="image/png">
<script src="https://web2.tecnico.ulisboa.pt/~ist199088/templates/test.js"></script>
    <!-- Favicon to work in all desktop browsers:
    <link rel="shortcut icon" href="//static.tecnico.ulisboa.pt/favicon.png" type="image/png"> -->
</head>

<body>
            <div id="background">
            <div class="overlay"></div>
        </div>
        <div class="App-header" id="content">
            <a href="{{home}}"style="color: #fff;">
                <img src="https://www.nba.com/apple-touch-icon.png" class="App-logo" alt="logo" />
            </a>
            <a href="{{home}}"style="color: #fff;">
                <h1>nbaDB</h1>
            </a>    </div>
        <div>
        <div id="content">
            {% if cursor %}
                <table>
                    <tbody>
                        {% for record in cursor %}
                        <tr>
                            <td><a href="games?player={{record[0]}}">{{record[0]}}</a></td>
                            <td>{{record[2]}}</td>
                            <td>{{record[3]}}</td>
                            <td>{{record[4]}}</td>
                            <td>{{record[5]}}</td>
                            <td>{{record[6]}}</td>
                            <td>{{record[7]}}</td>
                            <td>{{record[8]}}</td>
                            <td>{{record[9]}}</td>
                            <td>{{record[10]}}</td>
                            <td>{{record[12]}}</td>

                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <p> Erro: ao obter dados da base de dados!</p>
            {% endif %}
        </div>
    </div>

</body>

</html>
